name: ai-mud-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_mud
      POSTGRES_USER: ai_mud
      POSTGRES_PASSWORD: ai_mud_dev_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_mud -d ai_mud"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
