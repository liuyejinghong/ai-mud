# 游戏前端 nginx：SPA 静态 + API 反代（同源）。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API 反代：会话/基地/管理/健康 全部转发到 server 容器
  location ~ ^/(auth|base|admin|health) {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # 带 hash 的构建产物：内容寻址，可永久缓存（评审 B005：发版后返回访客拿旧 index
  # 引用已删除的旧资产 → 整页无样式，故 index 必须禁缓存、资产必须长缓存）。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 入口页禁缓存：每次加载都向服务器校验，避免发版后引用失效资产。
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
