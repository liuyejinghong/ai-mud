name: architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_mud_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/ai_mud_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: CI=true pnpm -r typecheck
      - name: Tests (PG integration auto-skip without DATABASE_URL)
        run: CI=true pnpm -r test
      - name: Architecture gate (baseline + new violations)
        run: pnpm arch:check
      - name: Architecture gate self-test (NEG probes)
        run: pnpm arch:test
      - name: Real-PG gates (migrations + concurrency + fault injection)
        run: |
          pnpm db:migrate
          CI=true pnpm test:postgres
      - name: NPC 7-day economy simulation
        run: pnpm verify:npc-simulation
